name: CI de Java com Maven (SCES)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-e-test:
    # O pipeline roda em uma máquina virtual Linux
    runs-on: ubuntu-latest

    steps:
      # 1. Faz o checkout do código do repositório
      - name: 1. Checkout do código
        uses: actions/checkout@v4

      # 2. Configura o ambiente Java (JDK 17)
      - [cite_start]name: 2. Configurar o Java (JDK 17) [cite: 73]
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # Cacheia os downloads do Maven para acelerar builds futuros
          cache: 'maven'

      # 3. Compila e executa os testes unitários com Maven
      - name: 3. Compilar e Rodar os Testes com Maven
        # Este é o comando exato pedido no documento de trabalho
        [cite_start]run: mvn test [cite: 75]